<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РМК · Планограмма магазина</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="planogram.css?v=20261007-p2">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header class="pg-top">
    <a class="pg-brand" href="admin-rmk.html" title="Вернуться в РМК Администратор">
      <span class="pg-logo">РМК</span><span class="pg-brand-t"><b>Планограмма</b><small>витрина и склад</small></span>
    </a>
    <select id="pgStore" class="pg-select" aria-label="Магазин"></select>
    <div class="pg-seg" id="pgZoneSeg">
      <button data-zone="hall" class="on">Торговый зал</button>
      <button data-zone="stock">Склад</button>
    </div>
    <div class="pg-seg" id="pgViewSeg">
      <button data-view="3d" class="on">3D</button>
      <button data-view="2d">2D план</button>
    </div>
    <div class="pg-sp"></div>
    <label class="pg-switch" title="Перемещение шкафов, полки, форма помещения">
      <input type="checkbox" id="pgEdit"><span class="pg-sw"></span><span>Редактирование</span>
    </label>
    <button class="pg-btn pg-save" id="pgSave" disabled>Сохранено</button>
  </header>
  <section class="pg-kpis" id="pgKpis"></section>
  <main class="pg-main">
    <div class="pg-stage" id="pgStage">
      <div class="pg-3d" id="pg3d"></div>
      <div class="pg-2d" id="pg2d"></div>
      <div class="pg-inset" id="pgInset" title="План помещения — нажмите, чтобы открыть 2D"></div>
      <div class="pg-legend" id="pgLegend">
        <span><i class="st-ok"></i>Хорошо</span><span><i class="st-low"></i>Мало (≤2)</span><span><i class="st-out"></i>Нет в магазине</span><span><i class="st-slow"></i>Нет продаж 30 дн.</span><span><i class="st-empty"></i>Пустое место</span>
      </div>
      <div class="pg-hint" id="pgHint"></div>
      <div class="pg-loading" id="pgLoading">⏳ Загружаю планограмму и остатки…</div>
    </div>
    <aside class="pg-panel" id="pgPanel"></aside>
  </main>
</div>
<div class="pg-modal" id="pgModal" hidden></div>
<div class="pg-toast" id="pgToast"></div>
<script type="module" src="planogram.js?v=20261007-p2"></script>
</body>
</html>
