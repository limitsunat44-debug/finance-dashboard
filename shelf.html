<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полка · РМК</title>
<link rel="icon" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Manrope,system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{background:#0f172a;color:#fff;font-weight:800;border-radius:10px;padding:6px 9px;font-size:13px}
  h1{font-size:20px;margin:0;line-height:1.2}
  .sub{color:#64748b;font-size:13px;margin-top:2px}
  .card{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kp div{background:#f8fafc;border-radius:10px;padding:8px}
  .kp small{display:block;color:#64748b;font-size:11.5px}.kp b{font-size:18px}
  .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid #eef2f7}
  .it:first-child{border-top:0}
  .it img,.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#f1f5f9;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
  .it b{font-size:14px;display:block}
  .it small{color:#64748b;font-size:12px}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px}
  .ok{background:#dcfce7;color:#166534}.restock{background:#ede9fe;color:#5b21b6}.out{background:#fee2e2;color:#991b1b}
  .units{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .u{font-size:11px;padding:2px 6px;border-radius:6px;background:#dcfce7;color:#166534;font-weight:600}
  .u.sold{background:#ede9fe;color:#5b21b6;text-decoration:line-through}.u.gone{background:#fee2e2;color:#991b1b}
  .sz{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .sz span{font-size:11px;background:#f1f5f9;border-radius:6px;padding:2px 6px}
  .info{font-size:13px;color:#334155;line-height:1.45}
  .err{color:#991b1b}
  .empty{color:#64748b;font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="logo">РМК</span><div><h1 id="t">Полка</h1><div class="sub" id="st">Загружаю…</div></div></div>
  <div id="body"></div>
</div>
<script>
(function () {
  const API = 'https://1c-sync-barcodes.vercel.app/api/pos';
  const SECRET = 'TySog2bN1bMJHsssoTvyCZO3IKOef1z0';
  const STORES = { '5ca2d3e6': 'Ортосалон «Айни»', '19db06fa': 'Ортосалон «Сиёма»', 'f9a506e7': 'Ортосалон «Баракат»', '8f0bf6e3': 'Ортосалон «Сити-Молл»' };
  const LBL = { ok: 'На витрине', restock: 'Нет на витрине — есть на складе', out: 'Нет в магазине' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const q = new URLSearchParams(location.search);
  const mp = location.pathname.match(/\/s\/([0-9a-fA-F]{6,36})\/([A-Za-z0-9_]+-\d{1,2})/);
  const w = (mp && mp[1]) || q.get('w') || '', s = (mp && mp[2]) || q.get('s') || '';
  const $ = (id) => document.getElementById(id);
  if (!w || !s) { $('st').innerHTML = '<span class="err">В ссылке нет кода полки</span>'; return; }
  fetch(`${API}?action=planogram-shelf&w=${encodeURIComponent(w)}&s=${encodeURIComponent(s)}`, { headers: { 'X-Provision-Secret': SECRET } })
    .then(r => r.json()).then(d => {
      if (!d.ok) throw new Error(d.error || 'Ошибка');
      const name = `${d.fixture.name} · Полка ${d.shelf.n}`;
      document.title = name + ' · РМК';
      $('t').textContent = name;
      $('st').textContent = `${STORES[String(d.wh).slice(0, 8)] || ''}${d.fixture.category ? ' · ' + d.fixture.category : ''}`;
      const restock = d.items.filter(i => i.status === 'restock').length;
      let h = `<div class="card kp"><div><small>Моделей</small><b>${d.items.length}</b></div><div><small>Свободных мест</small><b>${d.shelf.free}</b></div><div><small>Выставить</small><b style="color:${restock ? '#6d28d9' : 'inherit'}">${restock}</b></div></div>`;
      h += `<div class="card">${d.items.map(i => {
        const sizes = Object.keys(i.sizes || {}).sort((a, b) => (parseFloat(a) || 999) - (parseFloat(b) || 999));
        return `<div class="it">${i.photo ? `<img src="${esc(i.photo)}" alt="">` : '<div class="ph">👟</div>'}<div style="min-width:0">
          <b>${esc(i.name)}</b><small>${i.price ? i.price.toLocaleString('ru-RU') + ' с. · ' : ''}в магазине ${i.here} пар${i.scanned ? ` · на полке ${i.onShelf}` : ''}</small>
          <div><span class="pill ${i.status}">${LBL[i.status] || ''}</span></div>
          ${i.units.length ? `<div class="units">${i.units.map(u => `<span class="u ${u.onShelf ? '' : (u.st === 'sold' ? 'sold' : 'gone')}">${esc(u.size)} · №${esc(String(u.bc).slice(-4))}</span>`).join('')}</div>` : ''}
          ${sizes.length ? `<div class="sz">${sizes.map(k => `<span>${esc(k)}: <b>${i.sizes[k]}</b></span>`).join('')}</div>` : ''}
        </div></div>`;
      }).join('') || '<div class="empty">На полке пока нет товаров.</div>'}</div>`;
      h += `<div class="card info"><b>Как привязать товар к этой полке:</b><br>касса РМК → «Ещё» → «Полка: привязать товар» → отсканируйте этот QR → введите последние 6 цифр штрихкода каждой пары на полке и нажмите «Привязать».</div>`;
      $('body').innerHTML = h;
    }).catch(e => { $('st').innerHTML = `<span class="err">${esc(e.message)}</span>`; });
})();
</script>
</body>
</html>
